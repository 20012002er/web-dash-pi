<!-- Calendar plugin dashboard fragment. Renders day/month/list/time-grid views in CSS. -->
<style>
.plugin-calendar {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: 'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
    box-sizing: border-box;
    padding: 2vmin 2.5vmin;
}
.plugin-calendar .cal-title {
    font-size: clamp(1.2rem, 4.6vmin, 3.2rem);
    font-weight: 600;
    text-align: center;
    margin: 0 0 1.2vmin;
    line-height: 1.1;
    flex-shrink: 0;
}
.plugin-calendar .cal-body {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.plugin-calendar .cal-error {
    color: #ff6b6b;
    font-size: 2rem;
    text-align: center;
    padding: 2rem;
}

/* ---------- Month grid ---------- */
.plugin-calendar .cal-month-grid {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
}
.plugin-calendar .cal-dow-row {
    display: grid;
    flex-shrink: 0;
    border-bottom: 1px solid currentColor;
    margin-bottom: 0.5vmin;
}
.plugin-calendar .cal-dow-cell {
    padding: 0.6vmin 0.4vmin;
    text-align: center;
    font-weight: 600;
    font-size: clamp(0.7rem, 2.4vmin, 1.5rem);
    opacity: 0.85;
}
.plugin-calendar .cal-cells {
    display: grid;
    flex: 1;
    min-height: 0;
    gap: 1px;
}
.plugin-calendar .cal-cell {
    border: 1px solid currentColor;
    padding: 0.5vmin;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
}
.plugin-calendar .cal-cell.outside {
    opacity: 0.3;
}
.plugin-calendar .cal-cell.today {
    box-shadow: inset 0 0 0 2px currentColor;
}
.plugin-calendar .cal-day-num {
    font-size: clamp(0.7rem, 2.6vmin, 1.7rem);
    font-weight: 600;
    margin-bottom: 0.3vmin;
    flex-shrink: 0;
}
.plugin-calendar .cal-event-list {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.3vmin;
}
.plugin-calendar .cal-event-pill {
    font-size: clamp(0.55rem, 2vmin, 1.3rem);
    border-radius: 0.4vmin;
    padding: 0.1vmin 0.4vmin;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.25;
}
.plugin-calendar .cal-more {
    font-size: clamp(0.55rem, 1.9vmin, 1.2rem);
    opacity: 0.6;
    padding-left: 0.3vmin;
}

/* ---------- List view ---------- */
.plugin-calendar .cal-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}
.plugin-calendar .cal-list-date {
    font-size: clamp(0.85rem, 3vmin, 2rem);
    font-weight: 600;
    border-top: 1px solid currentColor;
    margin-top: 1vmin;
    padding: 0.8vmin 0 0.4vmin;
}
.plugin-calendar .cal-list-date:first-child {
    border-top: none;
    margin-top: 0;
}
.plugin-calendar .cal-list-item {
    display: flex;
    align-items: baseline;
    gap: 1vmin;
    padding: 0.5vmin 0;
    font-size: clamp(0.8rem, 2.8vmin, 1.9rem);
}
.plugin-calendar .cal-list-dot {
    width: 1.1vmin;
    height: 1.1vmin;
    min-width: 1.1vmin;
    border-radius: 50%;
    align-self: center;
}
.plugin-calendar .cal-list-time {
    opacity: 0.7;
    white-space: nowrap;
    flex-shrink: 0;
}
.plugin-calendar .cal-list-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.plugin-calendar .cal-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.6;
    font-size: clamp(1rem, 4vmin, 2.5rem);
}

/* ---------- Time grid ---------- */
.plugin-calendar .cal-time-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    overflow: hidden;
}
.plugin-calendar .cal-time-col {
    display: flex;
    flex-direction: column;
    border-right: 1px solid currentColor;
    flex-shrink: 0;
}
.plugin-calendar .cal-time-label {
    flex: 1;
    padding-right: 0.6vmin;
    text-align: right;
    font-size: clamp(0.6rem, 2vmin, 1.3rem);
    opacity: 0.7;
    transform: translateY(-50%);
}
.plugin-calendar .cal-day-cols {
    flex: 1;
    min-width: 0;
    display: grid;
    overflow: hidden;
}
.plugin-calendar .cal-day-col {
    border-left: 1px solid currentColor;
    position: relative;
    min-width: 0;
    overflow: hidden;
}
.plugin-calendar .cal-day-header {
    text-align: center;
    font-size: clamp(0.65rem, 2.2vmin, 1.4rem);
    font-weight: 600;
    padding: 0.5vmin 0;
    border-bottom: 1px solid currentColor;
    flex-shrink: 0;
}
.plugin-calendar .cal-day-slots {
    flex: 1;
    position: relative;
    min-height: 0;
}
.plugin-calendar .cal-hour-line {
    border-top: 1px solid currentColor;
    opacity: 0.25;
    position: absolute;
    left: 0;
    right: 0;
}
.plugin-calendar .cal-time-event {
    position: absolute;
    left: 2px;
    right: 2px;
    border-radius: 0.4vmin;
    padding: 0.2vmin 0.4vmin;
    font-size: clamp(0.55rem, 1.9vmin, 1.2rem);
    overflow: hidden;
    line-height: 1.2;
}
.plugin-calendar .cal-now-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 0;
    border-top: 2px solid var(--cal-now-color, #ff0000);
    z-index: 5;
}
</style>

<div class="plugin-calendar" id="plugin-calendar-root">
    <div id="plugin-calendar-content"></div>
</div>

<script>
(function () {
    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
        });
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function parseIso(iso) {
        if (!iso) return null;
        var d = new Date(iso);
        return isNaN(d.getTime()) ? null : d;
    }

    function formatTime(iso, timeFormat) {
        var d = parseIso(iso);
        if (!d) return '';
        var h = d.getHours();
        var m = d.getMinutes();
        if (timeFormat === '24h') {
            return pad(h) + ':' + pad(m);
        }
        var ap = h < 12 ? 'AM' : 'PM';
        var hh = h % 12 || 12;
        return hh + ':' + pad(m) + ' ' + ap;
    }

    // Compute the days-of-week header given weekStartDay (0=Sun) and weekend toggle
    function buildDowHeaders(weekStartDay, showWeekends) {
        var all = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        var rotated = all.slice(weekStartDay).concat(all.slice(0, weekStartDay));
        if (!showWeekends) {
            rotated = rotated.filter(function (d) { return d !== 'Sat' && d !== 'Sun'; });
        }
        return rotated;
    }

    function renderMonth(data) {
        var root = document.getElementById('plugin-calendar-content');
        var showWeekends = data.display_weekends;
        var weekStart = data.week_start_day || 0;
        var dows = buildDowHeaders(weekStart, showWeekends);
        var now = parseIso(data.now_iso);
        var todayStr = data.today;

        var titleHtml = data.title ? '<div class="cal-title">' + escapeHtml(data.title) + '</div>' : '';

        // Build events-by-date map
        var byDate = {};
        (data.events || []).forEach(function (evt) {
            var d = parseIso(evt.start);
            if (!d) return;
            var key = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
            (byDate[key] = byDate[key] || []).push(evt);

            // Multi-day all-day events span consecutive days
            if (evt.all_day && evt.end) {
                var endD = parseIso(evt.end);
                if (endD) {
                    var cur = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
                    var endDay = new Date(endD.getFullYear(), endD.getMonth(), endD.getDate());
                    while (cur < endDay) {
                        var k = cur.getFullYear() + '-' + pad(cur.getMonth() + 1) + '-' + pad(cur.getDate());
                        (byDate[k] = byDate[k] || []).push(evt);
                        cur.setDate(cur.getDate() + 1);
                    }
                }
            }
        });

        // Determine the month to display from "today"
        var base = parseIso(data.today) || now || new Date();
        var year = base.getFullYear();
        var month = base.getMonth();

        var firstOfMonth = new Date(year, month, 1);
        var pyWeekday = (firstOfMonth.getDay() + 6) % 7; // Mon=0 ... Sun=6
        var displayCol = (pyWeekday - ((weekStart - 1 + 7) % 7) + 7) % 7;
        // NOTE: original code used py_to_display mapping; the above reproduces it.
        var daysInMonth = new Date(year, month + 1, 0).getDate();

        var numCols = dows.length;
        var totalCells = displayCol + daysInMonth;
        var numRows = Math.ceil(totalCells / numCols);

        // Column index -> actual day-of-week name for weekend filtering
        var colDow = dows; // already filtered

        var html = titleHtml +
            '<div class="cal-body"><div class="cal-month-grid">' +
            '<div class="cal-dow-row" style="grid-template-columns:repeat(' + numCols + ',1fr);">';
        dows.forEach(function (d) {
            html += '<div class="cal-dow-cell">' + escapeHtml(d) + '</div>';
        });
        html += '</div><div class="cal-cells" style="grid-template-columns:repeat(' + numCols + ',1fr);grid-template-rows:repeat(' + numRows + ',1fr);">';

        for (var i = 0; i < numRows * numCols; i++) {
            var dayNum = i - displayCol + 1;
            if (dayNum < 1 || dayNum > daysInMonth) {
                html += '<div class="cal-cell outside"></div>';
                continue;
            }
            var cellDate = new Date(year, month, dayNum);
            var key = cellDate.getFullYear() + '-' + pad(cellDate.getMonth() + 1) + '-' + pad(cellDate.getDate());
            var isToday = key === todayStr;
            var dayEvents = byDate[key] || [];

            html += '<div class="cal-cell' + (isToday ? ' today' : '') + '">';
            html += '<div class="cal-day-num">' + dayNum + '</div>';
            html += '<div class="cal-event-list">';
            var maxShow = 3;
            for (var e = 0; e < Math.min(dayEvents.length, maxShow); e++) {
                var ev = dayEvents[e];
                html += '<div class="cal-event-pill" style="background:' + escapeHtml(ev.color) +
                    ';color:' + escapeHtml(ev.text_color) + '" title="' + escapeHtml(ev.title) + '">' +
                    escapeHtml(ev.title) + '</div>';
            }
            if (dayEvents.length > maxShow) {
                html += '<div class="cal-more">+' + (dayEvents.length - maxShow) + ' more</div>';
            }
            html += '</div></div>';
        }
        html += '</div></div></div>';
        root.innerHTML = html;
    }

    function renderList(data) {
        var root = document.getElementById('plugin-calendar-content');
        var titleHtml = data.title ? '<div class="cal-title">' + escapeHtml(data.title) + '</div>' : '';
        var events = (data.events || []).slice().sort(function (a, b) {
            return (a.start || '').localeCompare(b.start || '');
        });

        if (events.length === 0) {
            root.innerHTML = titleHtml + '<div class="cal-body"><div class="cal-empty">No events</div></div>';
            return;
        }

        var html = titleHtml + '<div class="cal-body"><div class="cal-list">';
        var currentDateStr = '';
        events.forEach(function (evt) {
            var d = parseIso(evt.start);
            if (!d) return;
            var dateLabel = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
            if (dateLabel !== currentDateStr) {
                currentDateStr = dateLabel;
                html += '<div class="cal-list-date">' + escapeHtml(dateLabel) + '</div>';
            }
            var timeLabel = evt.all_day ? 'All Day' : formatTime(evt.start, data.time_format);
            html += '<div class="cal-list-item">' +
                '<div class="cal-list-dot" style="background:' + escapeHtml(evt.color) + '"></div>' +
                '<div class="cal-list-time">' + escapeHtml(timeLabel) + '</div>' +
                '<div class="cal-list-title">' + escapeHtml(evt.title) + '</div>' +
                '</div>';
        });
        html += '</div></div>';
        root.innerHTML = html;
    }

    function renderTimeGrid(data) {
        var root = document.getElementById('plugin-calendar-content');
        var startHour = data.start_hour || 0;
        var endHour = data.end_hour || 24;
        if (endHour <= startHour) endHour = 24;
        var numHours = endHour - startHour;
        var now = parseIso(data.now_iso);
        var timeFormat = data.time_format;

        // Determine day columns
        var viewMode = data.view_mode; // timeGridDay | timeGrid | timeGridWeek
        var days = [];
        var baseDate = parseIso(data.today) || now || new Date();
        if (viewMode === 'timeGridDay') {
            days = [new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate())];
        } else {
            // timeGrid / timeGridWeek: 7 days starting from today
            var startD = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
            for (var i = 0; i < 7; i++) {
                days.push(new Date(startD.getFullYear(), startD.getMonth(), startD.getDate() + i));
            }
        }
        var numDays = days.length;

        var titleHtml = data.title ? '<div class="cal-title">' + escapeHtml(data.title) + '</div>' : '';

        // Hour label column
        var hourColWidth = '8%';
        var html = titleHtml + '<div class="cal-body"><div class="cal-time-grid" style="grid-template-columns:' + hourColWidth + ' 1fr;">';
        html += '<div class="cal-time-col">';
        for (var h = 0; h < numHours; h++) {
            var hour = startHour + h;
            var label;
            if (timeFormat === '24h') label = pad(hour) + ':00';
            else label = (hour % 12 || 12) + (hour < 12 ? 'AM' : 'PM');
            html += '<div class="cal-time-label">' + escapeHtml(label) + '</div>';
        }
        html += '</div>';

        // Day columns
        html += '<div class="cal-day-cols" style="grid-template-columns:repeat(' + numDays + ',1fr);">';
        days.forEach(function (day) {
            var dayHeader = day.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' });
            html += '<div class="cal-day-col"><div class="cal-day-header">' + escapeHtml(dayHeader) + '</div>';
            html += '<div class="cal-day-slots" data-day="' + day.getFullYear() + '-' + pad(day.getMonth() + 1) + '-' + pad(day.getDate()) + '">';

            // Hour lines
            for (var lh = 0; lh < numHours; lh++) {
                var topPct = (lh / numHours) * 100;
                html += '<div class="cal-hour-line" style="top:' + topPct + '%;"></div>';
            }

            // Events for this day
            var dayKey = day.getFullYear() + '-' + pad(day.getMonth() + 1) + '-' + pad(day.getDate());
            (data.events || []).forEach(function (evt) {
                if (evt.all_day) return;
                var ed = parseIso(evt.start);
                if (!ed) return;
                var eKey = ed.getFullYear() + '-' + pad(ed.getMonth() + 1) + '-' + pad(ed.getDate());
                if (eKey !== dayKey) return;

                var startMin = ed.getHours() * 60 + ed.getMinutes() - startHour * 60;
                if (startMin < 0) startMin = 0;
                var endMin = startMin + 60; // default 60 min
                if (evt.end) {
                    var endD = parseIso(evt.end);
                    if (endD) endMin = endD.getHours() * 60 + endD.getMinutes() - startHour * 60;
                }
                if (endMin > numHours * 60) endMin = numHours * 60;

                var topPct = (startMin / (numHours * 60)) * 100;
                var heightPct = ((endMin - startMin) / (numHours * 60)) * 100;
                var evtLabel = evt.title;
                if (data.display_event_time) {
                    evtLabel = formatTime(evt.start, timeFormat) + ' ' + evt.title;
                }
                html += '<div class="cal-time-event" style="top:' + topPct + '%;height:' + heightPct +
                    '%;background:' + escapeHtml(evt.color) + ';color:' + escapeHtml(evt.text_color) + '" title="' +
                    escapeHtml(evt.title) + '">' + escapeHtml(evtLabel) + '</div>';
            });

            // Now indicator
            if (data.display_now_indicator && now) {
                var nowKey = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
                if (nowKey === dayKey) {
                    var nowMin = now.getHours() * 60 + now.getMinutes() - startHour * 60;
                    if (nowMin >= 0 && nowMin <= numHours * 60) {
                        var nowTop = (nowMin / (numHours * 60)) * 100;
                        html += '<div class="cal-now-line" style="top:' + nowTop + '%;"></div>';
                    }
                }
            }

            html += '</div></div>';
        });
        html += '</div></div></div>';
        root.style.setProperty('--cal-now-color', data.now_indicator_color || '#ff0000');
        root.innerHTML = html;
    }

    function render(data) {
        if (!data) return;
        var root = document.getElementById('plugin-calendar-root');
        root.style.backgroundColor = data.background_color || '#fff';
        root.style.color = data.text_color || '#000';

        var v = data.view_mode;
        if (v === 'dayGridMonth' || v === 'dayGrid') renderMonth(data);
        else if (v === 'listMonth') renderList(data);
        else if (v === 'timeGridDay' || v === 'timeGridWeek' || v === 'timeGrid') renderTimeGrid(data);
        else renderMonth(data);
    }

    function renderError(msg) {
        var root = document.getElementById('plugin-calendar-content');
        root.innerHTML = '<div class="cal-error">' + msg + '</div>';
    }

    window.addEventListener('plugin-dashboard-loaded', function () {
        document.getElementById('plugin-calendar-content').innerHTML = '';
    });

    window.addEventListener('plugin-data', function (e) {
        var d = e.detail && e.detail.data;
        if (!d) return;
        render(d);
    });

    window.addEventListener('plugin-data-error', function (e) {
        var msg = (e.detail && e.detail.error) ? e.detail.error : 'Failed to load calendar.';
        renderError(msg);
    });
})();
</script>
