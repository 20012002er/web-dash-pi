<div class="plugin-image" style="width:100%;height:100%;background:#000;position:relative;">
  <img id="plugin-image-img" style="width:100%;height:100%;object-fit:cover;" alt="" />
  <div id="plugin-image-credit" style="position:absolute;left:0;right:0;bottom:0;
       background:rgba(0,0,0,0.7);color:#fff;padding:10px 16px;font-family:sans-serif;
       font-size:0.95rem;text-align:center;display:none;"></div>
  <script>
    (function () {
      var img = document.getElementById('plugin-image-img');
      var credit = document.getElementById('plugin-image-credit');

      window.addEventListener('plugin-data', function (e) {
        var data = (e.detail && e.detail.data) || {};
        if (data.image_url) {
          img.src = data.image_url;
        }
        // fit: letterbox (contain), fill: crop (cover)
        var fitMode = data.fit_mode || 'cover';
        img.style.objectFit = fitMode === 'fill' ? 'cover' : 'contain';

        // Photographer credit overlay at the bottom (when enabled)
        if (data.show_photo_info && (data.photographer || data.description)) {
          var text = '';
          if (data.description && data.photographer) {
            // Truncate description for the overlay
            var desc = data.description;
            if (desc.length > 60) desc = desc.slice(0, 57) + '...';
            text = desc + ' — by ' + data.photographer;
          } else if (data.photographer) {
            text = 'by ' + data.photographer;
          } else {
            text = data.description.length > 80 ? data.description.slice(0, 80) : data.description;
          }
          credit.textContent = text;
          credit.style.display = 'block';
        } else {
          credit.style.display = 'none';
        }
      });

      window.addEventListener('plugin-data-error', function (e) {
        var error = (e.detail && e.detail.error) || 'Unknown error';
        var container = document.querySelector('.plugin-image');
        if (container) {
          container.innerHTML = '<div style="color:red;padding:20px;">' + error + '</div>';
        }
      });
    })();
  </script>
</div>
