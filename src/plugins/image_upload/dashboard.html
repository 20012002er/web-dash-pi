<div class="plugin-image" style="width:100%;height:100%;background:#000;position:relative;">
  <img id="plugin-image-img" style="width:100%;height:100%;object-fit:contain;" alt="" />
  <div id="plugin-image-counter" style="position:absolute;top:12px;right:16px;color:#fff;
       background:rgba(0,0,0,0.55);padding:4px 10px;border-radius:6px;font-family:sans-serif;
       font-size:0.9rem;display:none;"></div>
  <script>
    (function () {
      var img = document.getElementById('plugin-image-img');
      var counter = document.getElementById('plugin-image-counter');

      window.addEventListener('plugin-data', function (e) {
        var data = (e.detail && e.detail.data) || {};
        if (data.image_url) {
          img.src = data.image_url + '?t=' + Date.now();
        }
        // fit: letterbox (contain), fill: crop (cover), blur: show full image
        var fitMode = data.fit_mode || 'fit';
        img.style.objectFit = fitMode === 'fill' ? 'cover' : 'contain';

        // Show index / total in the corner when available
        if (typeof data.total === 'number' && data.total > 0) {
          var displayIndex = (typeof data.index === 'number')
            ? (data.index === 0 ? data.total : data.index)
            : 1;
          counter.textContent = displayIndex + ' / ' + data.total;
          counter.style.display = 'block';
        } else {
          counter.style.display = 'none';
        }
      });

      window.addEventListener('plugin-data-error', function (e) {
        var error = (e.detail && e.detail.error) || 'Unknown error';
        var container = document.querySelector('.plugin-image');
        if (container) {
          container.innerHTML = '<div style="color:red;padding:20px;">' + error + '</div>';
        }
      });
    })();
  </script>
</div>
