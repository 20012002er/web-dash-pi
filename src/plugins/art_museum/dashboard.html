<!-- Art Museum plugin dashboard fragment. Full-screen artwork with title/artist/year overlay. -->
<style>
.plugin-artmuseum {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: #000;
    overflow: hidden;
    font-family: 'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
}
.plugin-artmuseum .am-img {
    width: 100%;
    height: 100%;
    display: block;
}
.plugin-artmuseum .am-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.85) 40%);
    color: #fff;
    padding: 6vmin 4vmin 3vmin;
    display: none;
}
.plugin-artmuseum .am-title {
    font-size: clamp(1.2rem, 5vmin, 3.4rem);
    font-weight: 600;
    line-height: 1.2;
    margin: 0 0 0.6vmin;
}
.plugin-artmuseum .am-subtitle {
    font-size: clamp(0.9rem, 3.2vmin, 2.1rem);
    opacity: 0.85;
    margin: 0 0 0.4vmin;
}
.plugin-artmuseum .am-museum {
    font-size: clamp(0.75rem, 2.6vmin, 1.6rem);
    opacity: 0.65;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}
.plugin-artmuseum .am-error {
    color: #ff6b6b;
    font-size: 2rem;
    text-align: center;
    padding: 2rem;
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
}
</style>

<div class="plugin-artmuseum" id="plugin-artmuseum-root">
    <img id="plugin-artmuseum-img" class="am-img" alt="" />
    <div id="plugin-artmuseum-overlay" class="am-overlay">
        <div id="plugin-artmuseum-title" class="am-title"></div>
        <div id="plugin-artmuseum-subtitle" class="am-subtitle"></div>
        <div id="plugin-artmuseum-museum" class="am-museum"></div>
    </div>
</div>

<script>
(function () {
    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
        });
    }

    var img = document.getElementById('plugin-artmuseum-img');
    var overlay = document.getElementById('plugin-artmuseum-overlay');

    window.addEventListener('plugin-dashboard-loaded', function () {
        img.removeAttribute('src');
        overlay.style.display = 'none';
    });

    window.addEventListener('plugin-data', function (e) {
        var d = e.detail && e.detail.data;
        if (!d) return;

        if (d.image_url) {
            // Proxy external images through the server to bypass CORS/CORP restrictions
            img.src = '/api/proxy_image?url=' + encodeURIComponent(d.image_url);
        }
        // fit: letterbox (contain), fill: crop (cover)
        var fitMode = d.fit_mode || 'fit';
        img.style.objectFit = fitMode === 'fill' ? 'cover' : 'contain';

        if (d.show_title) {
            document.getElementById('plugin-artmuseum-title').textContent = d.title || '';
            var sub = '';
            if (d.artist && d.year) {
                sub = d.artist + ', ' + d.year;
            } else if (d.artist) {
                sub = d.artist;
            } else if (d.year) {
                sub = d.year;
            }
            document.getElementById('plugin-artmuseum-subtitle').textContent = sub;
            document.getElementById('plugin-artmuseum-museum').textContent = d.museum || '';
            overlay.style.display = 'block';
        } else {
            overlay.style.display = 'none';
        }
    });

    window.addEventListener('plugin-data-error', function (e) {
        var msg = (e.detail && e.detail.error) ? e.detail.error : 'Failed to load artwork.';
        var root = document.getElementById('plugin-artmuseum-root');
        root.innerHTML = '<div class="am-error">' + escapeHtml(msg) + '</div>';
    });
})();
</script>
