<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DashPi Display</title>
    <style>
        /* Load the same font families used by the original DashPi display so
           plugin dashboard fragments render with the correct typefaces. */
        @font-face {
            font-family: 'Jost';
            src: url('{{ url_for('static', filename='fonts/Jost.ttf') }}') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Jost';
            src: url('{{ url_for('static', filename='fonts/Jost-SemiBold.ttf') }}') format('truetype');
            font-weight: 600;
            font-style: normal;
        }
        @font-face {
            font-family: 'DS-Digital';
            src: url('{{ url_for('static', filename='fonts/DS-DIGI/DS-DIGI.TTF') }}') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Napoli';
            src: url('{{ url_for('static', filename='fonts/Napoli.ttf') }}') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Dogica';
            src: url('{{ url_for('static', filename='fonts/dogicapixel.ttf') }}') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Dogica';
            src: url('{{ url_for('static', filename='fonts/dogicapixelbold.ttf') }}') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* Container that holds the active plugin's dashboard.html fragment. */
        #dashboard-container {
            width: 100vw;
            height: 100vh;
        }

        /* Semi-transparent centered overlay for error / reconnect messages.
           Hidden by default; display is toggled to 'flex' by display.js. */
        #error-overlay {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-family: sans-serif;
            font-size: 1.5rem;
            text-align: center;
            padding: 1rem;
            box-sizing: border-box;
            z-index: 1000;
        }

        /* Centered overlay shown during plugin transitions.
           Hidden by default; display is toggled to 'flex' by display.js. */
        #loading-indicator {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="dashboard-container"></div>
    <div id="error-overlay"></div>
    <div id="loading-indicator"><div class="spinner"></div></div>
    <script src="{{ url_for('static', filename='js/display.js') }}"></script>
</body>
</html>
